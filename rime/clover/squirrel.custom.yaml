# 鼠须管外观设置
# encoding: utf-8

patch:
  style:
    # Squirrel 1.0.1 起使用 linear，旧的 horizontal 字段已移除。
    candidate_list_layout: linear
    text_orientation: horizontal
    inline_preedit: true
    inline_candidate: false
    memorize_size: true
    translucency: true
    mutual_exclusive: false
    show_paging: false
    color_scheme: clover_fresh
    color_scheme_dark: clover_fresh_dark
    candidate_format: "[label] [candidate] [comment]"
    font_face: "PingFang SC"
    font_point: 16
    label_font_face: "SF Pro Text"
    label_font_point: 11
    comment_font_face: "PingFang SC"
    comment_font_point: 13
    corner_radius: 10
    hilited_corner_radius: 7
    border_height: 5
    border_width: 8
    spacing: 8
    shadow_size: 2

  preset_color_schemes:
    clover_fresh:
      name: "薄荷白／Clover Fresh"
      author: "Codex, for Clover"
      back_color: 0xF2FFFFFF
      border_color: 0x18A8A8A8
      text_color: 0xFF545454
      candidate_text_color: 0xFF303030
      label_color: 0xFF999999
      comment_text_color: 0xFF8A8A8A
      hilited_text_color: 0xFF245C3B
      hilited_back_color: 0x00000000
      hilited_candidate_text_color: 0xFFFFFFFF
      hilited_candidate_label_color: 0xFFDDF5E7
      hilited_comment_text_color: 0xFFDDF5E7
      hilited_candidate_back_color: 0xE662A878

    clover_fresh_dark:
      name: "深夜薄荷／Clover Fresh Dark"
      author: "Codex, for Clover"
      back_color: 0xEE252525
      border_color: 0x30484848
      text_color: 0xFFE0E0E0
      candidate_text_color: 0xFFF2F2F2
      label_color: 0xFF909090
      comment_text_color: 0xFF9A9A9A
      hilited_text_color: 0xFFA9E8BF
      hilited_back_color: 0x00000000
      hilited_candidate_text_color: 0xFF17251C
      hilited_candidate_label_color: 0xFF31523D
      hilited_comment_text_color: 0xFF31523D
      hilited_candidate_back_color: 0xE69DDBB2
